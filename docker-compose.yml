services:
  zeek1:
    build:
      context: ./
      dockerfile: ./src/Dockerfile
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    environment:
      - CONTAINER_NAME=zeek1
      - HAMSTRING_ZEEK_KAFKA_WAIT_INTERVAL_SECONDS=${HAMSTRING_ZEEK_KAFKA_WAIT_INTERVAL_SECONDS:-5}
      - HAMSTRING_ZEEK_KAFKA_OUTAGE_THRESHOLD_SECONDS=${HAMSTRING_ZEEK_KAFKA_OUTAGE_THRESHOLD_SECONDS:-15}
      - HAMSTRING_ZEEK_KAFKA_RECOVERY_STABILITY_SECONDS=${HAMSTRING_ZEEK_KAFKA_RECOVERY_STABILITY_SECONDS:-30}
    volumes:
      - ./config.yaml:/opt/config.yaml
      - ./data/test_pcaps/:/opt/static_files
